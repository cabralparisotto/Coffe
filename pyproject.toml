[project]
name = "coffe"
version = "0.1.0"
description = ""
authors = [
    {name = "cabralparisotto",email = "cabral.parisotto@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[tool.poetry]
packages = [{include = "coffe", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
